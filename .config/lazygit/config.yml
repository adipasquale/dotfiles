git:
  diffRenderers:
    - command: delta --paging=never
  mainBranches:
    - master
    - main
    - production
  commit:
    autoWrapCommitMessage: false
  skipHookPrefix: WIP
os:
  editPreset: nvim-remote
keybinding:
  commits:
    moveUpCommit: '<ctrl-shift-up>'
    moveDownCommit: '<ctrl-shift-down>'
